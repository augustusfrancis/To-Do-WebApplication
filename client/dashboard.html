<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - To-Do App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h2>To-Do App</h2>
            </div>
            <div class="nav-menu">
                <span class="user-name" id="userName">User</span>
                <button class="btn btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard Content -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Categories</h3>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item active">
                    <span class="menu-icon">📋</span>
                    <span>All Tasks</span>
                    <span class="task-count" id="allCount">0</span>
                </li>
                <li class="menu-item">
                    <span class="menu-icon">✓</span>
                    <span>Completed</span>
                    <span class="task-count" id="completedCount">0</span>
                </li>
                <li class="menu-item">
                    <span class="menu-icon">⏰</span>
                    <span>Pending</span>
                    <span class="task-count" id="pendingCount">0</span>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Add Task Section -->
            <div class="add-task-section">
                <h2>My Tasks</h2>
                <button class="btn btn-primary" id="addTaskBtn">+ Add New Task</button>
            </div>

            <!-- Add Task Form (Hidden by default) -->
            <div class="add-task-form" id="addTaskForm" style="display: none;">
                <div class="form-card">
                    <h3>Create New Task</h3>
                    <form id="taskForm">
                        <div class="form-group">
                            <label for="taskTitle">Task Title</label>
                            <input type="text" id="taskTitle" name="taskTitle" placeholder="Enter task title" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="taskDescription">Description</label>
                            <textarea id="taskDescription" name="taskDescription" rows="3" placeholder="Enter task description"></textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="taskPriority">Priority</label>
                                <select id="taskPriority" name="taskPriority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="taskDueDate">Due Date</label>
                                <input type="date" id="taskDueDate" name="taskDueDate">
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create Task</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Task Filter -->
            <div class="task-filter">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="pending">Pending</button>
                    <button class="filter-tab" data-filter="completed">Completed</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchTask" placeholder="Search tasks...">
                </div>
            </div>

            <!-- Tasks Grid -->
            <div class="tasks-grid" id="tasksGrid">
                <!-- Task cards will be dynamically inserted here -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h3>No tasks yet</h3>
                    <p>Create your first task to get started!</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/todo.js"></script>
</body>
</html>
